services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODELS_ROOT: /app/shared_models/embedding_models
      RERANKER_MODELS_ROOT: /app/shared_models/reranker_models
    volumes:
      - ./artifacts:/app/artifacts
      - /home/marco/shared_models:/app/shared_models
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
